<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RYUCORE // 認証</title>
<meta name="theme-color" content="#05060d">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script>try{var t=localStorage.getItem('ryucore.theme');if(t&&t!=='hearth')document.documentElement.dataset.theme=t}catch(e){}</script>
<style>
  .gate { position: relative; z-index: 1; min-height: 100vh; display: grid; place-items: center; padding: 16px; }
  .gate .panel { width: min(400px, 100%); }
  .gate .boot-logo { font-size: 32px; margin-bottom: 18px; }
  .gate form { display: grid; gap: 12px; }
  .gate input { width: 100%; padding: 10px 12px; font: 15px var(--f-mono); background: rgba(0, 0, 0, .35); border: 1px solid var(--line-2); outline: 0; letter-spacing: .1em; }
  .gate input:focus { border-color: var(--a1); box-shadow: 0 0 12px rgba(var(--a1-rgb), .25); }
  .gate .err { min-height: 1.2em; font: 12px var(--f-mono); color: var(--red); }
</style>
</head>
<body>
<div class="bg-hex" aria-hidden="true"></div>
<div class="bg-scan" aria-hidden="true"></div>
<main class="gate">
  <section class="panel">
    <div class="ph"><span class="no">ID</span><h2>AUTHENTICATE</h2><span class="jp">認証</span></div>
    <div class="boot-logo">RYUCORE<span>竜核 · AI COMMAND CORE</span></div>
    <form id="f">
      <label class="sr" for="pw">Password</label>
      <input id="pw" type="password" placeholder="PASSPHRASE // 合言葉" autocomplete="current-password" autofocus>
      <div class="err" id="err"></div>
      <button class="send" type="submit">ENGAGE ▸</button>
    </form>
  </section>
</main>
<div class="toasts" id="toasts"></div>
<script src="ui.js"></script>
<script>
$('#f').addEventListener('submit', async e => {
  e.preventDefault(); setText($('#err'), '');
  try { await POST('api/login', { password: $('#pw').value }); location.href = './' + location.hash; }
  catch (err) { setText($('#err'), 'ACCESS DENIED // ' + err.message); $('#pw').select(); }
});
</script>
</body>
</html>
